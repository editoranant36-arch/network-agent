services:
  # 1. High-Performance Go Diagnostics Agent (REST API, SSE & WebSockets)
  - type: web
    name: wifi-agent-go
    runtime: go
    plan: free
    rootDir: agent-go
    buildCommand: go build -o wifi-agent main.go
    startCommand: ./wifi-agent
    envVars:
      - key: PORT
        value: 8080

  # 2. LAN Sentinel Web Dashboard (Next.js Fullstack UI)
  - type: web
    name: lan-sentinel-dashboard
    runtime: node
    plan: free
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_AGENT_URL
        fromService:
          type: web
          name: wifi-agent-go
          property: host
